<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apresentações</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: radial-gradient(circle at 20% 30%, rgba(0, 180, 255, 0.28), transparent 25%), radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.20), transparent 28%), radial-gradient(circle at 60% 10%, rgba(40, 120, 255, 0.18), transparent 22%), #07111C;
            background-size: 140% 140%;
            animation: lightMove 12s ease-in-out infinite alternate;

            @keyframes lightMove {
                0% {
                    background-position: 0% 0%, 100% 100%, 60% 10%;
                }

                50% {
                    background-position: 35% 60%, 70% 30%, 20% 70%;
                }

                100% {
                    background-position: 70% 100%, 20% 0%, 80% 40%;
                }
            }

            color: white;

            font-family: Arial,
            Helvetica,
            sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =========================================
           MENU
           ========================================= */

        .menu {

            width: min(90%, 600px);

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 25px;

            text-align: center;
        }


        .titulo {

            font-size:
                clamp(2rem, 6vw, 3.5rem);

            margin: 0 0 25px;

            font-weight: 600;
        }


        .subtitulo {

            margin-top: -15px;

            margin-bottom: 15px;

            color:
                rgba(255, 255, 255, 0.55);

            font-size: 1rem;
        }


        /* =========================================
           BOTÕES
           ========================================= */

        .botao {

            width: 100%;

            max-width: 420px;

            min-height: 70px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 16px;

            background:
                rgba(255, 255, 255, 0.07);

            color: white;

            font-size:
                clamp(1rem, 4vw, 1.25rem);

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }


        .botao:hover {

            background:
                rgba(255, 255, 255, 0.14);

            border-color:
                rgba(255, 255, 255, 0.25);

            transform:
                translateY(-2px);
        }


        .botao:active {

            transform:
                scale(0.98);
        }


        /* =========================================
           CELULAR
           ========================================= */

        @media (max-width: 600px) {

            .menu {
                width: 85%;
            }

            .botao {
                min-height: 64px;
            }
        }
    </style>

</head>


<body>


    <main class="menu">

        <h1 class="titulo">
            Apresentações
        </h1>

        <p class="subtitulo">
            Selecione uma apresentação
        </p>


        <button class="botao" onclick="location.href='nel.html'">
            Apresentação Nel
        </button>


        <button class="botao" onclick="location.href='nayara.html'">
            Apresentação Nayara
        </button>

    </main>


</body>

</html>
